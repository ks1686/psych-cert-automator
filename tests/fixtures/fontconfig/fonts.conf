<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Keep certificate rasters stable across machines. -->
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="pattern">
    <test qual="any" name="family">
      <string>Arial Unicode MS</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Noto Sans</string>
    </edit>
    <edit name="file" mode="assign" binding="strong">
      <string>/usr/share/fonts/truetype/noto/NotoSans-Regular.ttf</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>Californian FB</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Tinos</string>
    </edit>
  </match>
</fontconfig>
