name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  python:
    name: Python (pytest + ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Install Python deps
        run: uv sync --frozen

      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Ruff
        run: >-
          uv run ruff check
          src/pipeline.py
          src/backends/main.py
          src/models/certificate.py
          certgen.py
          tests/test_pipeline.py
          tests/test_templates_packaging.py

      - name: Pytest
        run: uv run pytest

  rust:
    name: Rust (cargo check)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux WebKit deps
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev

      - name: Placeholder sidecar for tauri-build
        run: |
          mkdir -p src-tauri/bin/api
          : > src-tauri/bin/api/psych-cert-gen-x86_64-unknown-linux-gnu
          chmod +x src-tauri/bin/api/psych-cert-gen-x86_64-unknown-linux-gnu

      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --offline || cargo check --manifest-path src-tauri/Cargo.toml

  unit:
    name: Unit (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun run test:unit

      - name: Type-check + production build
        run: bun run build

  e2e-mock:
    name: E2E (mock API)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install chromium --with-deps

      - name: Mock e2e
        run: bun run test:e2e:mock

      - name: Upload mock report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-mock-report
          path: |
            e2e/report/mock
            test-results/mock
          if-no-files-found: ignore

  e2e-integration:
    name: E2E (integration)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Install Python deps
        run: uv sync --frozen

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install chromium --with-deps

      - name: Integration e2e
        run: bun run test:e2e:integration

      - name: Upload integration report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-integration-report
          path: |
            e2e/report/integration
            test-results/integration
          if-no-files-found: ignore
